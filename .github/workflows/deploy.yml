name: Build & Deploy Next.js to Hostinger

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-fe-nextjs-hostinger
      cancel-in-progress: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://hiwayapi.com/api

      - name: Deploy Out to Hostinger
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp

          # 1. Validate GitHub Secrets existence
          if [ -z "$FTP_SERVER" ]; then
            echo "::error::GitHub Secret FTP_SERVER is missing or empty! Please configure it in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$FTP_USERNAME" ]; then
            echo "::error::GitHub Secret FTP_USERNAME is missing or empty! Please configure it in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::error::GitHub Secret FTP_PASSWORD is missing or empty! Please configure it in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # 2. Clean any trailing carriage returns, whitespace, or protocol prefixes
          SERVER=$(echo "$FTP_SERVER" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's|^ftp[s]*://||')
          USERNAME=$(echo "$FTP_USERNAME" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          PASSWORD=$(echo "$FTP_PASSWORD" | tr -d '\r\n')

          echo "Target Server: $SERVER (length: ${#SERVER})"
          echo "FTP Username: $USERNAME (length: ${#USERNAME})"
          echo "FTP Password: [PROTECTED] (length: ${#PASSWORD} chars)"

          echo "=== Executing Deployment (Attempt 1: Plain FTP - Hostinger Standard) ==="
          if lftp -u "$USERNAME","$PASSWORD" "$SERVER" -e "
            debug 3;
            set ssl:verify-certificate no;
            set ftp:ssl-allow no;
            set net:timeout 60;
            set net:max-retries 3;
            pwd;
            mirror -a -R --verbose --parallel=3 ./out/ ./;
            put -O ./ ./public/.htaccess;
            quit;
          "; then
            echo "✓ Deployment finished successfully via Standard FTP!"
            exit 0
          fi

          echo "=== Executing Deployment (Attempt 2: FTPS with TLS) ==="
          if lftp -u "$USERNAME","$PASSWORD" "$SERVER" -e "
            debug 3;
            set ssl:verify-certificate no;
            set ssl:check-hostname no;
            set ftp:ssl-allow yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set net:timeout 60;
            set net:max-retries 3;
            pwd;
            mirror -a -R --verbose --parallel=3 ./out/ ./;
            put -O ./ ./public/.htaccess;
            quit;
          "; then
            echo "✓ Deployment finished successfully via FTPS!"
            exit 0
          fi

          echo "::error::Both FTP and FTPS connection attempts failed with 530 Login incorrect. Please verify FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD in GitHub Secrets against Hostinger hPanel FTP Accounts."
          exit 1
